name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # canary, not latest: the committed bun.lock is lockfileVersion 2, which
      # the current stable (1.3.x) cannot parse. Revisit once 1.4 ships stable.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - run: bun install --frozen-lockfile

      # The browser download is the slowest step, so cache it against the
      # resolved Playwright version rather than re-fetching ~100 MB per run.
      - name: Resolve Playwright version
        id: pw
        run: |
          echo "version=$(bun -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # Only chromium is needed. --with-deps installs the system libraries,
      # which a cache hit still needs, so it runs either way.
      - run: bunx playwright install --with-deps chromium

      - run: bun run test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
